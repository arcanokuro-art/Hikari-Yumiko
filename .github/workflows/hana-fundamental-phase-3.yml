name: HANA Fundamental Research Fase 3
on:
  pull_request:
    branches: [research/hana-fundamental-phase-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 19, 43, 71, 101]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      HANA_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r research/fundamental-phase-2/requirements.txt
      - name: Reproduce and verify Phase 2
        working-directory: research/fundamental-phase-2
        run: |
          python -m unittest -v
          mkdir -p "$RUNNER_TEMP/phase2"
          python experiment.py --seed "$HANA_SEED" > "$RUNNER_TEMP/phase2/seed-$HANA_SEED.json"
          python ../fundamental-phase-3/verify_repro.py "$RUNNER_TEMP/phase2/seed-$HANA_SEED.json"
      - name: Evaluate Phase 3
        working-directory: research/fundamental-phase-3
        run: |
          python -m unittest -v
          mkdir -p "$RUNNER_TEMP/phase3"
          python experiment.py --seed "$HANA_SEED" > "$RUNNER_TEMP/phase3/seed-$HANA_SEED.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hana-fundamental-phase-3-seed-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/phase2/
            ${{ runner.temp }}/phase3/
