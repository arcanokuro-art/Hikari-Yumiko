name: HANA Fundamental Research Fase 2
on:
  pull_request:
    branches: [research/hana-fundamental-phase-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 19, 43, 71, 101]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/fundamental-phase-2
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      HANA_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python experiment.py --seed "$HANA_SEED" > "seed-$HANA_SEED.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hana-fundamental-phase-2-seed-${{ matrix.seed }}
          path: research/fundamental-phase-2/seed-${{ matrix.seed }}.json
