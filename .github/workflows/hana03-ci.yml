name: Hikari HANA-0.3 CPU experiments
on:
  pull_request:
    branches: [experiments/hana-0-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiments:
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 19, 43]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPERIMENT_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - name: Train matched CPU models
        shell: bash
        run: |
          mkdir metrics
          for model in penalized unpenalized memory-128 adaptive fixed-1 znc gru; do
            python -m hikari.hana03_experiment --model "$model" --seed "$EXPERIMENT_SEED" > "metrics/$model.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hana03-cpu-seed-${{ matrix.seed }}
          path: metrics/
