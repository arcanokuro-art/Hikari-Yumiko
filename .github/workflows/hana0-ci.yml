name: Hikari HANA-0 Nano CPU
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - name: Compare recurrent models on CPU
        run: |
          mkdir metrics
          for model in hana znc gru; do
            python -m hikari.hana_experiment --model "$model" | tee "metrics/$model.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hana0-cpu-metrics
          path: metrics/
